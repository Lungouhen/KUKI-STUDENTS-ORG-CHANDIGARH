# KSO Chandigarh — nginx server block
#
# Assumes TLS certificates issued by Certbot/Let's Encrypt. Obtain them with:
#   sudo certbot --nginx -d ksochandigarh.org -d www.ksochandigarh.org
#
# Adjust `fastcgi_pass` to match the installed PHP-FPM version:
#   ls /var/run/php/

# ─── Redirect all plaintext traffic to HTTPS ───
server {
    listen 80;
    listen [::]:80;
    server_name ksochandigarh.org www.ksochandigarh.org;

    # Allow ACME renewal challenges to be served over HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ksochandigarh.org www.ksochandigarh.org;

    root /var/www/ksochandigarh/public;
    index index.php;
    charset utf-8;

    # ─── TLS ───
    ssl_certificate     /etc/letsencrypt/live/ksochandigarh.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ksochandigarh.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ─── Security headers ───
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection         "0" always;  # superseded by CSP in modern browsers

    # Uploaded member photos and medical documents are user-supplied: never
    # allow them to execute or render as active content.
    location ^~ /storage/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Disposition "inline" always;
        location ~ \.php$ { deny all; }
    }

    # Cache immutable, content-hashed Vite output aggressively.
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:css|js|woff2?|ttf|jpg|jpeg|png|gif|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    client_max_body_size 8M;  # member photo + medical document uploads

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;
    }

    # Block dotfiles (.env, .git, ...) except ACME challenges.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
